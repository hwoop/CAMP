# AdaNeg (NeurIPS 2024), the paper's setting (Sec. 4.1) for every ID dataset. The code is the official
# TTAPromptPostprocessor_noadagap of PolyU-VCLab/OpenOOD-VLM (openood/postprocessors/adaneg); these are its arguments
#   memleng 10, thres 0.5, gap 0.5   L, threshold gamma and gap g (Eq. 8)
#   beta 5.5, lambdaval 0.1          beta (Eq. 11), lambda (Eq. 13)
#   samada true                      S_nl + lambda S_sa with sample-adaptive proxies (Eq. 11-13; Table 3's reported row)
#   prompt nice, ood_number          "The nice <label>."; M = 10,000, and 70,000 for CIFAR
# from the released code (the paper does not state them)
#   group_num 5 with the seed-0 permutation, in_score combine, int(beta) = 5 in the proxy weights
# samada_layout factored for CIFAR only: at M = 70,000 each official [B, K, D] fp16 proxy tensor takes about 14 GB,
# more than a 24 GB GPU holds; the factored form computes the same cosine in float32 (equal up to rounding)
postprocessor:
  name: adaneg
  postprocessor_args:
    thres: 0.5
    gap: 0.5
    memleng: 10
    lambdaval: 0.1
    beta: 5.5
    group_num: 5
    random_permute: true
    samada: true
    in_score: combine
    per_dataset:
      cifar10:
        ood_number: 70000
        samada_layout: factored
      cifar100:
        ood_number: 70000
        samada_layout: factored
vlm:
  text:
    prompt: nice
    center: true
  neglabel:
    corpus: wordnet
    ood_number: 10000
    cos_percentile: 0.95
    candidate_mode: selected
    encode_unselected: true

# EFT_plugin_oodd: CAMP with oodd as the plug-in detector (Section 5.4, Table 4, row "+ CAMP" under oodd).
# Appended to --config after configs/postprocessors/camp/default.yml. semantic.args is a copy of
# configs/postprocessors/oodd/default.yml's postprocessor_args (vlm.neglabel copied from the same file);
# fusion.semantic_weight 1.0 adds the detector's standardized score to z(R) with equal weight;
# vlm.text.prompt stays CAMP's (nice) because it is not redefined here.
postprocessor:
  postprocessor_args:
    semantic:
      method: oodd
      args:
        t: 1
        ngroup: 100
    fusion:
      semantic_weight: 1.0
vlm:
  neglabel:
    corpus: wordnet
    ood_number: 10000
    cos_percentile: 0.95
    candidate_mode: selected
    encode_unselected: true
